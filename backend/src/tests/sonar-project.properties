# Unique project key and name for SonarQube
sonar.projectKey=backend-notes-app
sonar.projectName=Backend Notes Application
sonar.projectVersion=1.0.0

# Path to the source code relative to this file
sonar.sources=src

# Exclude test files, node_modules, and coverage reports from static source analysis
sonar.exclusions=src/tests/**, node_modules/**, coverage/**

# Specify tests directory and files
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.js

# Language details
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript rules & environment configurations
sonar.javascript.environments=node

# Path to execution report for test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info